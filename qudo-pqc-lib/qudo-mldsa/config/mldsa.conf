# ML-DSA Post-Quantum Signature Configuration
# Production-ready Post-Quantum Cryptography

[Security]
# Default security level: 44, 65, or 87
# 44  = NIST Level 2 (Lightweight applications)
# 65  = NIST Level 3 (Recommended for most applications)
# 87  = NIST Level 5 (Maximum security)
default_level = 65

# Enable/disable specific security levels
enable_44 = true
enable_65 = true
enable_87 = true

[Performance]
# Use AVX2 optimizations (x86/x64 only, auto-detected)
use_avx2 = auto

# Use NEON optimizations (ARM64 only, auto-detected)
use_neon = auto

# Maximum number of threads for parallel operations
max_threads = 4

[Algorithm]
# Use deterministic signatures (same input always produces same signature)
# WARNING: Deterministic mode requires careful nonce management
deterministic = false

# Enable context string support (FIPS 204)
enable_context = true

[Logging]
# Enable verbose logging
verbose = false

# Log to file
log_to_file = false

# Log file path (Linux/macOS: /var/log/mldsa/mldsa.log, Windows: C:\ProgramData\mldsa\mldsa.log)
log_file_path = /var/log/mldsa/mldsa.log
