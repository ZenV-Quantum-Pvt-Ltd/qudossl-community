# ML-KEM OpenSSL Integration Configuration
# Production-ready Post-Quantum Cryptography

[Security]
# Default security level: 512, 768, or 1024
# 512  = NIST Level 1 (IoT, embedded systems)
# 768  = NIST Level 3 (Recommended for most applications)
# 1024 = NIST Level 5 (Maximum security)
default_level = 768

# Enable/disable specific security levels
enable_512 = true
enable_768 = true
enable_1024 = true

[Performance]
# Use AVX2 optimizations (x86/x64 only, auto-detected)
use_avx2 = auto

# Use AES-NI instructions (auto-detected)
use_aes_ni = auto

# Maximum number of threads for parallel operations
max_threads = 4

[OpenSSL Integration]
# Replace RSA key exchange in TLS with ML-KEM
# WARNING: Only enable if all endpoints support ML-KEM
replace_rsa = false

# Hybrid mode: Use both ML-KEM and RSA (recommended for transition)
# Provides quantum resistance while maintaining compatibility
hybrid_mode = true

[Logging]
# Enable verbose logging
verbose = false

# Log to file
log_to_file = false

# Log file path (Linux/macOS: /var/log/mlkem/mlkem.log, Windows: C:\ProgramData\mlkem\mlkem.log)
log_file_path = /var/log/mlkem/mlkem.log

[Compatibility]
# Fallback to RSA if ML-KEM fails (for backward compatibility)
fallback_to_rsa = true

# Minimum OpenSSL version required
min_openssl_version = 1.1.1
