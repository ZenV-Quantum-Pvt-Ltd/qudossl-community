# ML-KEM Integration Metadata
# Production-Ready Post-Quantum KEM Library
# SPDX-License-Identifier: MIT

name: ML-KEM OpenSSL Integration
version: 1.0.0
description: |
  Production-ready ML-KEM (Module-Lattice-Based Key-Encapsulation Mechanism)
  implementation for OpenSSL integration. Based on NIST FIPS 203 standard.
  
  Provides quantum-resistant key encapsulation with three security levels
  and cross-platform support (Linux, Windows, macOS, embedded systems).

authors:
  - Qudo PQC Team

license: MIT

repository: https://github.com/qudo/mlkem-openssl-integration

algorithms:
  - name: ML-KEM-512
    type: KEM
    nist_level: 1
    claimed_security: 128
    public_key_size: 800
    secret_key_size: 1632
    ciphertext_size: 768
    shared_secret_size: 32
    ind_cca: true
    description: "NIST Security Level 1 - equivalent to AES-128"
    
  - name: ML-KEM-768
    type: KEM
    nist_level: 3
    claimed_security: 192
    public_key_size: 1184
    secret_key_size: 2400
    ciphertext_size: 1088
    shared_secret_size: 32
    ind_cca: true
    description: "NIST Security Level 3 - equivalent to AES-192 (recommended)"
    
  - name: ML-KEM-1024
    type: KEM
    nist_level: 5
    claimed_security: 256
    public_key_size: 1568
    secret_key_size: 3168
    ciphertext_size: 1568
    shared_secret_size: 32
    ind_cca: true
    description: "NIST Security Level 5 - equivalent to AES-256"

platforms:
  - name: Linux
    architectures: [x86_64, aarch64, riscv64]
    tested: true
    
  - name: Windows
    architectures: [x86_64, aarch64]
    tested: true
    
  - name: macOS
    architectures: [x86_64, arm64]
    tested: true
    
  - name: Embedded
    architectures: [arm, arm64, riscv32]
    tested: false

optimizations:
  - platform: x86_64
    feature: AVX2
    speedup: 3.5x
    enabled_by_default: true
    
  - platform: aarch64
    feature: NEON
    speedup: 4.2x
    enabled_by_default: true
    
  - platform: riscv64
    feature: RVV
    speedup: 2.8x
    enabled_by_default: false

dependencies:
  required:
    - name: OpenSSL
      version: ">=1.1.1"
      purpose: "Cryptographic primitives and RNG"
      
  optional:
    - name: CMake
      version: ">=3.15"
      purpose: "Build system"

features:
  security:
    - Constant-time operations
    - Secure memory handling
    - Memory locking (prevent swap)
    - Secure key zeroization
    - Side-channel resistance
    
  performance:
    - Runtime CPU detection
    - Multiple architecture backends
    - Vectorized implementations
    - Cache-friendly algorithms
    
  integration:
    - OpenSSL provider interface
    - Standard KEM API
    - PEM/DER key formats
    - Thread-safe operations
    
  verification:
    - CBMC formal verification (mlkem-native)
    - HOL-Light proofs (assembly)
    - Known Answer Tests (KAT)
    - Interoperability tests

standards:
  - name: FIPS 203
    status: Final
    url: https://csrc.nist.gov/pubs/fips/203/final
    
  - name: NIST PQC
    status: Standardized
    round: Final

build_options:
  - name: MLKEM_USE_OPENSSL
    default: ON
    description: "Use OpenSSL for cryptographic primitives"
    
  - name: MLKEM_BUILD_SHARED
    default: ON
    description: "Build shared library"
    
  - name: MLKEM_BUILD_STATIC
    default: ON
    description: "Build static library"
    
  - name: MLKEM_ENABLE_AVX2
    default: ON
    description: "Enable AVX2 optimizations (x86_64)"
    
  - name: MLKEM_ENABLE_NEON
    default: ON
    description: "Enable NEON optimizations (ARM64)"
    
  - name: MLKEM_STRICT_WARNINGS
    default: OFF
    description: "Enable strict compiler warnings"
    
  - name: MLKEM_EMBEDDED_BUILD
    default: OFF
    description: "Build for embedded systems"

documentation:
  - README.md
  - QUICK_START.md
  - docs/PROJECT_SUMMARY.md
  - BUILDING.md (in mlkem-native)

examples:
  - simple_kem.c
  - client_server integration

tests:
  - Unit tests
  - Known Answer Tests (KAT)
  - Cross-platform tests
  - Performance benchmarks
