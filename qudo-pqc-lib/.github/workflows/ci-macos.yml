name: macOS CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: "macos / ${{ matrix.mode }}"
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, fips]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install cmake ninja openssl@3

      - name: Build (${{ matrix.mode }})
        env:
          OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
        run: |
          if [ "${{ matrix.mode }}" = "fips" ]; then
            ./build.sh --fips -t
          else
            ./build.sh -t
          fi
