name: Cross-Compilation CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cross:
    name: "cross / ${{ matrix.arch }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triplet: aarch64-linux-gnu
            toolchain: cmake/toolchains/aarch64-linux-gnu.cmake
            apt_pkgs: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - arch: arm32
            triplet: arm-linux-gnueabihf
            toolchain: cmake/toolchains/arm-linux-gnueabihf.cmake
            apt_pkgs: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          - arch: riscv64
            triplet: riscv64-linux-gnu
            toolchain: cmake/toolchains/riscv64-linux-gnu.cmake
            apt_pkgs: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ${{ matrix.apt_pkgs }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DQUDO_PQC_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Verify artifact
        run: file build/lib/libqudo-pqc.so || file build/libqudo-pqc.so || true
